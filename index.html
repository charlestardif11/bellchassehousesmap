<style>
  :root {
    --blue: #0060a9;
    --blue-dark: #004a85;
    --bg: #f2f4f6;
    --panel: #ffffff;
    --ink: #1c2733;
    --muted: #5b6673;
    --line: #dfe3e8;
    --heart: #e0245e;
    --centris: #0060a9;
    --duproprio: #d97706;
    --radius: 8px;
    --shadow: 0 1px 3px rgba(20,30,40,0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 0;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    border-bottom: 1px solid var(--line);
  }
  .logo {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--blue);
    letter-spacing: -0.01em;
  }
  .logo span { color: var(--ink); font-weight: 400; font-size: 0.95rem; margin-left: 6px; }
  .resultbar {
    padding: 12px 24px 0;
    font-size: 0.9rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .resultbar strong { color: var(--ink); }
  .legend { display: flex; gap: 14px; font-size: 0.78rem; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  .filterbar {
    display: flex;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 14px;
    padding: 10px 24px;
  }
  .filter-field { display: flex; flex-direction: column; gap: 4px; }
  .filter-field label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; }
  .filter-field .range-inputs { display: flex; align-items: center; gap: 6px; }
  .filter-field input[type="number"] {
    width: 92px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 0.82rem; color: var(--ink); background: var(--panel);
  }
  .filter-field select {
    padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 0.82rem; color: var(--ink); background: var(--panel); max-width: 220px;
  }
  .filter-liked-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font-size: 0.82rem; font-weight: 600;
    cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .filter-liked-btn .hi { color: var(--muted); }
  .filter-liked-btn.active { background: var(--heart); border-color: var(--heart); color: #fff; }
  .filter-liked-btn.active .hi { color: #fff; }
  .filter-reset {
    padding: 7px 10px; font-size: 0.78rem; color: var(--blue); background: none; border: none;
    cursor: pointer; text-decoration: underline;
  }

  .layout { display: flex; height: calc(100vh - 158px); min-height: 480px; }
  .list {
    flex: 1;
    min-width: 340px;
    max-width: 460px;
    overflow-y: auto;
    background: var(--bg);
    padding: 14px;
  }
  .empty-msg { padding: 30px 14px; text-align: center; color: var(--muted); font-size: 0.85rem; }
  #map { flex: 1.4; min-width: 0; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 14px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .card:hover, .card.highlight { border-color: var(--blue); box-shadow: 0 2px 10px rgba(0,96,169,0.18); }
  .card-photo {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #dde2e7;
    overflow: hidden;
  }
  .card-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-photo .noimg {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 0.72rem; text-align: center; padding: 10px;
  }
  .src-tag {
    position: absolute; top: 8px; left: 8px;
    font-size: 0.62rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 4px; color: #fff;
  }
  .src-tag.centris { background: var(--centris); }
  .src-tag.duproprio { background: var(--duproprio); }
  .heart {
    position: absolute; top: 8px; right: 8px;
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(255,255,255,0.92);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.95rem; color: #b6bcc4;
    border: none; cursor: pointer; transition: color 0.15s, transform 0.1s;
  }
  .heart:hover { transform: scale(1.08); }
  .heart.liked { color: var(--heart); }
  .card-body { padding: 12px 14px 14px; }
  .price { font-size: 1.15rem; font-weight: 700; color: var(--ink); }
  .addr { font-size: 0.85rem; color: var(--ink); margin: 4px 0 2px; font-weight: 500; }
  .muni { font-size: 0.8rem; color: var(--muted); margin: 0 0 6px; }
  .specs { font-size: 0.76rem; color: var(--muted); margin: 0 0 8px; line-height: 1.4; }
  .stats { display: flex; flex-wrap: wrap; gap: 10px 14px; font-size: 0.8rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
  .stats span { display: flex; align-items: center; gap: 5px; }
  .taxes { font-size: 0.76rem; color: var(--muted); margin-top: 6px; }
  .card-cta {
    display: block;
    text-align: center;
    margin-top: 10px;
    padding: 8px;
    border-radius: 6px;
    background: var(--blue);
    color: #fff;
    font-size: 0.82rem;
    font-weight: 600;
    text-decoration: none;
  }
  .card-cta:hover { background: var(--blue-dark); }
  .leaflet-popup-content-wrapper { border-radius: 8px; }
  .popup-card { width: 210px; font-family: inherit; }
  .popup-card img { width: 100%; height: 130px; object-fit: cover; border-radius: 6px 6px 0 0; display: block; }
  .popup-card .pcbody { padding: 8px 2px 2px; }
  .popup-card .price { font-size: 1rem; }
  .popup-card .muni { margin-bottom: 4px; }
  .popup-card .specs { margin-bottom: 6px; }
  .popup-card a { color: var(--blue); font-size: 0.78rem; font-weight: 600; text-decoration: none; }
  .notice {
    margin: 0 24px 12px;
    padding: 9px 13px;
    background: #fff7e6;
    border: 1px solid #f2d391;
    border-radius: 6px;
    font-size: 0.76rem;
    color: var(--ink);
  }
</style>

  <div class="notice">

</header>
<div class="layout">
  <div class="list" id="list"></div>
  <div id="map"></div>
</div>

// --- Favoris (localStorage) ---
const LIKES_KEY = 'bellechasse_likes';
function getLikes() {
  try { return new Set(JSON.parse(localStorage.getItem(LIKES_KEY)) || []); }
  catch (e) { return new Set(); }
}
function saveLikes(set) {
  try { localStorage.setItem(LIKES_KEY, JSON.stringify(Array.from(set))); }
  catch (e) { /* stockage indisponible, on continue sans persister */ }
}
let likes = getLikes();

// --- Filtres ---
const filters = { min: null, max: null, beds: 0, muni: '', likedOnly: false };

function fmtPrice(p) {
  return p.toLocaleString('fr-CA', {style:'currency', currency:'CAD', maximumFractionDigits:0});
}
function fmtNum(n) { return n.toLocaleString('fr-CA'); }
function badgeClass(source) { return source === "Centris" ? "centris" : "duproprio"; }

function specsLine(l) {
  const parts = [];
  if (l.year) parts.push(typeof l.year === 'number' ? `Construit en ${l.year}` : l.year);
  if (l.type) parts.push(l.type);
  if (l.living) parts.push(`${fmtNum(l.living)} pc habitables`);
  if (l.lot) parts.push(`Terrain ${fmtNum(l.lot)} pc`);
  return parts.join(' · ');
}

function applyFilters(list) {
  return list.filter(l => {
    if (filters.min != null && l.price < filters.min) return false;
    if (filters.max != null && l.price > filters.max) return false;
    if (filters.beds > 0 && (l.beds || 0) < filters.beds) return false;
    if (filters.muni && l.muni !== filters.muni) return false;
    if (filters.likedOnly && !likes.has(l.id)) return false;
    return true;
  });
}

const map = L.map('map', {zoomControl: true}).setView([46.68, -70.80], 9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  referrerPolicy: 'origin',
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

let markers = {};
const markerLayer = L.layerGroup().addTo(map);

function heartClickHandler(id) {
  return (e) => {
    e.stopPropagation();
    if (likes.has(id)) likes.delete(id); else likes.add(id);
    saveLikes(likes);
    renderAll();
  };
}

function renderList(filtered) {
  const listEl = document.getElementById('list');
  listEl.innerHTML = '';
  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="empty-msg">Aucune propriété ne correspond à ces filtres.</div>';
    return;
  }
  filtered.forEach(l => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + l.id;
    card.onclick = () => {
      map.flyTo([l.lat, l.lon], 14, {duration: 0.6});
      if (markers[l.id]) markers[l.id].openPopup();
    };
    const iconClass = badgeClass(l.source);
    const photoHtml = l.photo
      ? `<img src="${l.photo}" alt="Photo de la propriété" loading="lazy">`
      : `<div class="noimg">Photo non disponible sur cette source — voir l'annonce</div>`;
    const liked = likes.has(l.id);
    card.innerHTML = `
      <div class="card-photo">
        ${photoHtml}
        <span class="src-tag ${iconClass}">${l.source}</span>
        <button class="heart ${liked ? 'liked' : ''}" data-id="${l.id}" aria-label="Ajouter aux favoris">${liked ? '♥' : '♡'}</button>
      </div>
      <div class="card-body">
        <div class="price">${fmtPrice(l.price)}</div>
        <div class="addr">${l.addr}</div>
        <div class="muni">${l.muni}</div>
        <div class="specs">${specsLine(l)}</div>
        <div class="stats">
          ${l.beds ? `<span>🛏 ${l.beds} ch.</span>` : ''}
          ${l.baths ? `<span>🛁 ${l.baths} sdb</span>` : ''}
          ${l.parking ? `<span>🅿️ ${l.parking}</span>` : ''}
        </div>
        ${l.taxes ? `<div class="taxes">Taxes municipales + scolaires : ${fmtPrice(l.taxes)}/an</div>` : ''}
        <a class="card-cta" href="${l.link}" target="_blank" rel="noopener">Voir l'annonce et les photos</a>
      </div>
    `;
    listEl.appendChild(card);
    card.querySelector('.heart').addEventListener('click', heartClickHandler(l.id));
  });
}

function renderMarkers(filtered) {
  markerLayer.clearLayers();
  markers = {};
  filtered.forEach(l => {
    const color = l.source === "Centris" ? "#0060a9" : "#d97706";
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:18px;height:18px;border-radius:50%;background:${color};border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.4);"></div>`,
      iconSize: [18,18],
      iconAnchor: [9,9]
    });
    const marker = L.marker([l.lat, l.lon], {icon});
    const photoHtml = l.photo ? `<img src="${l.photo}" alt="">` : '';
    marker.bindPopup(`
      <div class="popup-card">
        ${photoHtml}
        <div class="pcbody">
          <div class="price">${fmtPrice(l.price)}</div>
          <div class="muni">${l.addr}, ${l.muni}</div>
          <div class="specs">${specsLine(l)}</div>
          <a href="${l.link}" target="_blank" rel="noopener">Voir l'annonce (${l.source}) ↗</a>
        </div>
      </div>
    `);
    marker.on('click', () => {
      document.querySelectorAll('.card').forEach(c => c.classList.remove('highlight'));
      const cardEl = document.getElementById('card-' + l.id);
      if (cardEl) { cardEl.classList.add('highlight'); cardEl.scrollIntoView({behavior:'smooth', block:'center'}); }
    });
    marker.addTo(markerLayer);
    markers[l.id] = marker;
  });
}

function populateMuniOptions() {
  const sel = document.getElementById('filterMuni');
  const munis = Array.from(new Set(listings.map(l => l.muni))).sort();
  munis.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    sel.appendChild(opt);
  });
}

function renderAll() {
  const filtered = applyFilters(listings);
  document.getElementById('resultCount').textContent = filtered.length;
  renderList(filtered);
  renderMarkers(filtered);
}

document.getElementById('priceMin').addEventListener('input', (e) => {
  filters.min = e.target.value ? Number(e.target.value) : null;
  renderAll();
});
document.getElementById('priceMax').addEventListener('input', (e) => {
  filters.max = e.target.value ? Number(e.target.value) : null;
  renderAll();
});
document.getElementById('filterBeds').addEventListener('change', (e) => {
  filters.beds = Number(e.target.value);
  renderAll();
});
document.getElementById('filterMuni').addEventListener('change', (e) => {
  filters.muni = e.target.value;
  renderAll();
});
document.getElementById('filterLikedBtn').addEventListener('click', (e) => {
  filters.likedOnly = !filters.likedOnly;
  e.currentTarget.classList.toggle('active', filters.likedOnly);
  renderAll();
});
document.getElementById('filterReset').addEventListener('click', () => {
  filters.min = null; filters.max = null; filters.beds = 0; filters.muni = ''; filters.likedOnly = false;
  document.getElementById('priceMin').value = '';
  document.getElementById('priceMax').value = '';
  document.getElementById('filterBeds').value = '0';
  document.getElementById('filterMuni').value = '';
  document.getElementById('filterLikedBtn').classList.remove('active');
  renderAll();
});

populateMuniOptions();
renderAll();
map.fitBounds(L.latLngBounds(listings.map(l => [l.lat, l.lon])), {padding: [30, 30]});
</script>
